      <text x="356" y="216">4</text><rect x="380" y="204" width="200" height="12" rx="6" fill="#334155"/><rect x="380" y="204" width="10" height="12" rx="6" fill="#38bdf8"/><text x="590" y="216">5%</text>
      <text x="48" y="248">5</text><rect x="72" y="236" width="200" height="12" rx="6" fill="#334155"/><rect x="72" y="236" width="44" height="12" rx="6" fill="#38bdf8"/><text x="282" y="248">22%</text>
      <text x="356" y="248">6</text><rect x="380" y="236" width="200" height="12" rx="6" fill="#334155"/><rect x="380" y="236" width="8" height="12" rx="6" fill="#38bdf8"/><text x="590" y="248">4%</text>
