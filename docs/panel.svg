    <text x="48" y="1062" fill="#94a3b8">node</text><text x="480" y="1062" fill="#e2e8f0" text-anchor="end">1.8%</text><text x="632" y="1062" fill="#64748b" text-anchor="end">780 MB</text>
    <text x="48" y="1092" fill="#94a3b8">Google Chrome</text><text x="480" y="1092" fill="#e2e8f0" text-anchor="end">1.1%</text><text x="632" y="1092" fill="#64748b" text-anchor="end">767 MB</text>
    <text x="48" y="1122" fill="#94a3b8">Code Helper</text><text x="480" y="1122" fill="#e2e8f0" text-anchor="end">0.6%</text><text x="632" y="1122" fill="#64748b" text-anchor="end">636 MB</text>
  </g>

