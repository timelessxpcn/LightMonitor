<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1150" cy="40" r="180" fill="#38bdf8" opacity="0.06"/>
  <circle cx="90" cy="330" r="140" fill="#34d399" opacity="0.05"/>

  <!-- pulse line -->
  <polyline points="60,290 160,290 190,250 220,310 250,270 280,290 420,290"
            fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <text x="60" y="120" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', sans-serif"
        font-size="64" font-weight="700" fill="#f8fafc">LightMonitor</text>
  <rect x="62" y="142" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="190" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="24" fill="#94a3b8">轻量级 macOS 菜单栏系统监控</text>
  <text x="60" y="224" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="17" fill="#64748b">Lightweight system monitor in your menu bar · Native Swift · Zero telemetry</text>

  <!-- menu bar mockup -->
  <g>
    <rect x="620" y="120" width="600" height="52" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1"/>
    <circle cx="648" cy="146" r="6" fill="#f87171"/>
    <circle cx="668" cy="146" r="6" fill="#fbbf24"/>
    <circle cx="688" cy="146" r="6" fill="#34d399"/>
    <text x="716" y="153" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="19" fill="#e2e8f0">CPU 12%   RAM 45%   ↓1.2M ↑34K   DSK 62%</text>
  </g>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="16" fill="#94a3b8">
    <text x="620" y="215">常驻内存 14 MB</text>
    <text x="800" y="215">平均 CPU 1.0%</text>
    <text x="980" y="215">零特权 · 零遥测</text>
  </g>
  <g>
    <rect x="620" y="235" width="150" height="30" rx="15" fill="#38bdf8" opacity="0.15"/>
    <text x="641" y="256" font-family="-apple-system, sans-serif" font-size="15" fill="#38bdf8">macOS 13+</text>
    <rect x="785" y="235" width="120" height="30" rx="15" fill="#34d399" opacity="0.15"/>
    <text x="812" y="256" font-family="-apple-system, sans-serif" font-size="15" fill="#34d399">Swift</text>
    <rect x="920" y="235" width="120" height="30" rx="15" fill="#fbbf24" opacity="0.15"/>
    <text x="951" y="256" font-family="-apple-system, sans-serif" font-size="15" fill="#fbbf24">MIT</text>
  </g>
</svg>